<header class="flex flex-row justify-between h-[70px] items-center w-full border-b-1 border-[#d0dceccc]">
    <ul class="flex gap-x-[40px] font-[18px] h-full items-center">
        <a routerLink="/" class="hover:underline-offset-6 hover:underline" routerLinkActive="bg-[#7644BBcc] text-[#ffffff] font-semibold px-[16px] py-[5px] rounded-[4px]" [routerLinkActiveOptions]="{ exact: true }"><li>Jobs List</li></a>
        <li class="hover:underline-offset-6 hover:underline">Profile</li>
        <li class="hover:underline-offset-6 hover:underline">Resumes</li>
        <li class="hover:underline-offset-6 hover:underline">Cover Letters</li>
    </ul>
    <div class="flex gap-x-[20px] font-[18px] h-full items-center">
        <button routerLink="/register" class="flex justify-between text-[#7644BBcc] bg-[#ffffff] font-semibold items-center h-[40px] border-[#7644BBcc] border-1 px-[25px] rounded-full hover:cursor-pointer">
            Register
        </button>
        <button routerLink="/login" class="flex justify-between text-[#ffffff] font-semibold items-center h-[40px] bg-[#7644BBcc] px-[25px] rounded-full hover:cursor-pointer shadow-md shadow-[#7644BB44]">
            Connexion
        </button>
    </div>
</header>
