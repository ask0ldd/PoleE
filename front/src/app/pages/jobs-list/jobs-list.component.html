<div class="flex flex-col w-full">
    <app-header/>
    <div class="flex flex-col w-full gap-y-[13px] pt-[15px] pb-[30px]">
        <div (click)="handleDownloadModel()">Download Model</div>
        <app-job-filter-bar (filterParamsChange)="handleFilterBarParamsChange($event)"/> <!-- [filterParams]="searchParams"-->
        @if(jobsOffers == null || jobsOffers.length == 0) {
            <article class="flex w-full text-center">Loading...</article>
        }
        @if(jobsOffers && jobsOffers.length > 0) {
            <div class="text-right text-[14px]">
                {{jobsOffers.length}} Offers displayed.
            </div>
            <div style="flex-wrap: wrap;" class="flex flex-row w-full wrap gap-[20px]">
                @for(jobsOffer of jobsOffers; track jobsOffer) {
                    <app-job-item (emitJob)="toggleDrawer($event)" [jobOffer]="jobsOffer"/>
                }
            </div>
        }
    </div>
</div>
<!-- when closed does emit out of the drawer, set this.drawOpen to false -->
<app-drawer [isOpen]="this.drawerOpen" (closeDrawer)="this.drawerOpen = false"> 
    <app-job-offer [jobOffer]="activeJobOffer"/>
</app-drawer>
